<!DOCTYPE html>
<html>
    <head>
        <style>

            body{
                font-family: Arial, Helvetica, sans-serif
                ;
                background: rgb(240, 255, 254);
                text-align: center;
                padding: 30px;
            }
            h1{
                color: rgb(0, 102, 128);
            }
            input{
                padding: 8px;
                margin: 5px;
                border: 2px solid rgb(0, 102, 128) ;
                border-radius: 6px;
                width: 220px;
            }
            button{
            background: rgb(0, 102, 128);
            color:rgb(198, 252, 252);
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        #timer{
            color: rgb(55, 117, 116);
        }

        </style>
</head>
<body>
    <h1>Lucky Draw</h1>
    <p>Enter your name and guess a number to win!</p>
    <input type="text" id="name" placeholder="Your name"required><br>
  <p id="msg-name"></p>
    <input type="number" id="guess" placeholder="Guess  a number (0 to 10000)" min="0" max="10000" required><br>
<p id="msg-guess"></p>

<button onclick="checkForm()">Try My Luck!</button>

  <p id="result"></p>
  <p id="timer"></p>

  <script>

    var seconds = 0;
    setInterval(function() {
      seconds = seconds + 1;
      document.getElementById("timer").textContent = "You have been here for " + seconds + " seconds!";
    }, 1000);

    function checkForm() {
      var name = document.getElementById("name").value;
      var guess = document.getElementById("guess").value;
      var ok = true;

      if (name == "") {
        document.getElementById("msg-name").textContent = "Please enter your name!";
        document.getElementById("msg-name").style.color = "red";
        ok = false;
      } else {
        document.getElementById("msg-name").textContent = "Great name!";
        document.getElementById("msg-name").style.color = "green";
      }

      if (guess == "") {
        document.getElementById("msg-guess").textContent = "Please enter a guess!";
        document.getElementById("msg-guess").style.color = "red";
        ok = false;
      } else {
        document.getElementById("msg-guess").textContent = "Guess saved!";
        document.getElementById("msg-guess").style.color = "green";
      }

      if (ok == true) {
        var lucky = Math.floor(Math.random() * 10000) + 1;
        if (guess == lucky) {
          document.getElementById("result").textContent = "You win, " + name + "! The lucky number was " + lucky + "!";
          document.getElementById("result").style.color = "green";
        } else {
          document.getElementById("result").textContent = "So close, " + name + "! The lucky number was " + lucky + ". Try again!";
          document.getElementById("result").style.color = "navy";
        }
      }
    }

  </script>
</body>
</html>
